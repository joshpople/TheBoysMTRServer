name: Merge Resource Packs, JSONs, and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip coreutils python3

      - name: Extract Packs (Preserving MTR Configs)
        run: |
          mkdir -p extracted_workspace
          mkdir -p mtr_json_holding
          
          if [ ! -d "packs" ] || [ -z "$(ls -A packs/*.zip 2>/dev/null)" ]; then
            echo "❌ Error: No zip files found in the 'packs/' directory!"
            exit 1
          fi

          # Safe find loop for spaces in filenames
          find packs/ -maxdepth 1 -name "*.zip" | sort | while read -r pack; do
            echo "Extracting: $pack"
            
            # Extract the MTR json safely to a holding folder first using unzip (harmless for raw text files)
            pack_name=$(basename "$pack" .zip)
            unzip -p "$pack" "assets/mtr/mtr_custom_resources.json" > "mtr_json_holding/${pack_name}.json" 2>/dev/null || rm -f "mtr_json_holding/${pack_name}.json"
            
            # Use 7z to extract the full pack. 
            # -y automatically answers 'yes' to overwrites
            # -o sets the output workspace directory (Note: NO space after -o)
            7z x "$pack" -y -oextracted_workspace/

            # Reset permissions cleanly for the next file loop
            chmod -R 755 extracted_workspace/
          done

      - name: Smart Merge MTR JSON Files
        run: |
          python3 - << 'EOF'
          import os
          import json

          holding_dir = "mtr_json_holding"
          target_file = "extracted_workspace/assets/mtr/mtr_custom_resources.json"

          # Initialize a blank skeleton master layout for MTR
          master_data = {
              "custom_trains": {},
              "trains": [],
              "stations": [],
              "depots": []
          }

          if os.path.exists(holding_dir) and os.listdir(holding_dir):
              print("Found MTR custom resource configurations. Merging lists...")
              for file_name in sorted(os.listdir(holding_dir)):
                  file_path = os.path.join(holding_dir, file_name)
                  try:
                      with open(file_path, 'r', encoding='utf-8') as f:
                          data = json.load(f)
                          
                          # Merge dictionaries safely
                          if "custom_trains" in data and isinstance(data["custom_trains"], dict):
                              master_data["custom_trains"].update(data["custom_trains"])
                          
                          # Merge arrays safely without losing entries
                          for key in ["trains", "stations", "depots"]:
                              if key in data and isinstance(data[key], list):
                                  master_data[key].extend(data[key])
                                  
                      print(f" Successfully merged: {file_name}")
                  except Exception as e:
                      print(f" Skipped parsing {file_name} due to an error: {e}")

              # Ensure the asset path directory exists
              os.makedirs(os.path.dirname(target_file), exist_ok=True)
              
              # Write out the clean compiled JSON mapping
              with open(target_file, 'w', encoding='utf-8') as out:
                  json.dump(master_data, out, indent=2)
              print("Master mtr_custom_resources.json updated successfully.")
          else:
              print("No MTR JSON configurations found to combine.")
          EOF

      - name: Compile Unified Resource Pack (Fast Compression)
        run: |
          cd extracted_workspace
          zip -1 -r ../resourcepack.zip .
          cd ..

      - name: Generate SHA-1 Hash
        id: generate_hash
        run: |
          HASH=$(sha1sum resourcepack.zip | awk '{print $1}')
          echo "Generated Merged SHA-1: $HASH"
          echo "$HASH" > resourcepack.zip.sha1

      - name: Deploy directly to Dedicated Server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "resourcepack.zip,resourcepack.zip.sha1"
          target: "/var/www/html/packs"
          strip_components: 0

      - name: Automatically Update server.properties Hash
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            NEW_HASH=$(cat /var/www/html/packs/resourcepack.zip.sha1)
            PROP_FILE="/var/lib/pelican/volumes/${{ secrets.PELICAN_SERVER_ID }}/server.properties"
            
            if [ -f "$PROP_FILE" ]; then
              # Use python to do a completely safe key-value property replacement
              python3 -c "
              import sys
              
              file_path = '$PROP_FILE'
              new_hash = '$NEW_HASH'
              
              with open(file_path, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              
              updated_lines = []
              found_sha1 = False
              
              for line in lines:
                  # Safely replace the line if it starts with the sha1 key
                  if line.strip().startswith('resource-pack-sha1='):
                      updated_lines.append(f'resource-pack-sha1={new_hash}\n')
                      found_sha1 = True
                  else:
                      updated_lines.append(line)
              
              # Fallback case: if the key wasn't in the file at all, append it safely
              if not found_sha1:
                  updated_lines.append(f'resource-pack-sha1={new_hash}\n')
                  
              with open(file_path, 'w', encoding='utf-8') as f:
                  f.writelines(updated_lines)
              "
              echo "✅ server.properties SHA-1 hash updated safely via Python."
            else:
              echo "❌ Error: server.properties not found at $PROP_FILE"
              exit 1
            