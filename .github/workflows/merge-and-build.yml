name: Deploy Individual Resource Packs to PackPulse

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true

    - name: Checkout LFS objects explicit pull
      run: git lfs pull

    # Step 1: Send the exact individual pack zips straight to your Nginx folder
    - name: Copy packs to web server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        source: "packs/*.zip"
        target: "/var/www/html/resourcepacks"

    # Step 2: Dynamically build the manifest listing every single pack on the host
    - name: Generate PackPulse Manifest
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          WEB_DIR="/var/www/html/resourcepacks"
          MANIFEST="$WEB_DIR/manifest.json"
          
          # Start writing the JSON file structure
          echo '{ "resourcepacks": [' > $MANIFEST
          
          first=true
          for file in $WEB_DIR/packs/*.zip; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # Calculate the SHA-256 hash of this specific individual pack
              hash=$(sha256sum "$file" | awk '{print $1}')
              
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> $MANIFEST
              fi
              
              # Append this specific pack to the PackPulse array
              cat <<EOF >> $MANIFEST
                {
                  "name": "${filename%.*}",
                  "path": "resourcepacks/packs/$filename",
                  "url": "http://148.251.140.13/resourcepacks/packs/$filename",
                  "hash": "$hash",
                  "required": true
                }
          EOF
            fi
          done
          
          # Close the JSON file structure
          echo '] }' >> $MANIFEST
          echo "✅ PackPulse manifest.json built dynamically with all individual packs!"