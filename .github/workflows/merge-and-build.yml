name: Merge & Build Resource Pack

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Combine packs
      run: |
        python -c "
        import os, zipfile, json

        packs_dir = 'packs'
        output_zip = 'resourcepack.zip'
        combined_mtr_data = {'channels': [], 'custom_resources': []}

        with zipfile.ZipFile(output_zip, 'w', zipfile.ZIP_DEFLATED) as out_zip:
            for file_name in sorted(os.listdir(packs_dir)):
                if file_name.endswith('.zip'):
                    file_path = os.path.join(packs_dir, file_name)
                    with zipfile.ZipFile(file_path, 'r') as in_zip:
                        for item in in_zip.infolist():
                            if item.filename == 'assets/mtr/mtr_custom_resources.json':
                                try:
                                    data = json.loads(in_zip.read(item.filename))
                                    if 'channels' in data:
                                        combined_mtr_data['channels'].extend(data['channels'])
                                    if 'custom_resources' in data:
                                        combined_mtr_data['custom_resources'].extend(data['custom_resources'])
                                except Exception as e:
                                    print(f'Error reading json from {file_name}: {e}')
                            else:
                                try:
                                    out_zip.writestr(item.filename, in_zip.read(item.filename))
                                except zipfile.BadZipFile:
                                    print(f'Skipping corrupted file entry in {file_name}: {item.filename}')
                                except Exception as e:
                                    print(f'Error copying {item.filename} from {file_name}: {e}')

            if combined_mtr_data['channels'] or combined_mtr_data['custom_resources']:
                out_zip.writestr('assets/mtr/mtr_custom_resources.json', json.dumps(combined_mtr_data, indent=4))
        "

    - name: Get resourcepack sha1
      id: sha1
      run: |
        echo "sha1=$(sha1sum resourcepack.zip | awk '{print $1}')" >> $GITHUB_OUTPUT

    - name: Copy pack to web server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        source: "resourcepack.zip"
        target: "/var/www/html/resourcepacks"

    - name: Generate PackPulse Manifest and Update Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          # 1. Fallback update for the local Pelican server volume
          PROP_FILE="/var/lib/pelican/volumes/${{ secrets.PELICAN_SERVER_ID }}/server.properties"
          if [ -f "$PROP_FILE" ]; then
            python3 -c "
            with open('$PROP_FILE', 'r') as f: lines = f.readlines()
            with open('$PROP_FILE', 'w') as f:
                for line in lines:
                    if line.startswith('resource-pack-sha1='): f.write('resource-pack-sha1=${{ steps.sha1.outputs.sha1 }}\n')
                    else: f.write(line)
            "
            echo "✅ server.properties fallback hash updated."
          fi

          # 2. Build the live PackPulse sync manifest directly in your Nginx asset folder
          WEB_DIR="/var/www/html/resourcepacks"
          cat <<EOF > \$WEB_DIR/packpulse.json
          {
            "resourcepacks": [
              {
                "name": "The Boys MTR Server Assets",
                "url": "http://148.251.140.13/resourcepacks/resourcepack.zip",
                "hash": "${{ steps.sha1.outputs.sha1 }}",
                "required": true
              }
            ]
          }
          EOF
          echo "✅ packpulse.json manifest successfully generated with hash: ${{ steps.sha1.outputs.sha1 }}"

    - name: Copy pack to server volume
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        source: "resourcepack.zip"
        target: "/var/lib/pelican/volumes/${{ secrets.PELICAN_SERVER_ID }}"