name: Deploy Resource Packs via Official PackPulse Script

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true

    - name: Checkout LFS objects explicit pull
      run: git lfs pull

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Step 1: Mimic the exact server pack layout the script expects
    # (It scans server-pack/resourcepacks/ for your archives)
    - name: Prepare PackPulse Layout
      run: |
        mkdir -p server-pack/resourcepacks
        cp packs/*.zip server-pack/resourcepacks/

    # Step 2: Download and run the official manifest tool
    # Using the script's exact flags: --pack-root and --output
    - name: Generate Official Manifest
      run: |
        curl -fsSL -o generate_manifest.py https://raw.githubusercontent.com/Kamilhik/PackPulseMod/main/scripts/generate_manifest.py
        
        python3 generate_manifest.py \
          --pack-root server-pack \
          --base-url "http://148.251.140.13/resourcepacks" \
          --output server-pack/manifest.json

    # Step 3: Copy the individual zips and verified manifest out to Nginx
    - name: Copy packs and manifest to web server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        source: "server-pack/resourcepacks/*.zip,server-pack/manifest.json"
        target: "/var/www/html/resourcepacks"
        strip_components: 1