name: Merge & Build Resource Pack

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Add any pip requirements here if your combine.py needs them

    - name: Run combine script
      run: |
        # Search the workspace for the script and grab its directory path
        SCRIPT_PATH=$(find . -name "combine.py" -print -quit)
        
        if [ -z "$SCRIPT_PATH" ]; then
          echo "❌ Error: combine.py could not be found anywhere in the repository layout!"
          echo "Current directory contents:"
          ls -R
          exit 1
        fi
        
        echo "✅ Found script at: $SCRIPT_PATH"
        # Change into the script's actual folder and execute it
        cd "$(dirname "$SCRIPT_PATH")"
        python combine.py
        
        # Move the compiled resourcepack.zip back up to the root workspace for deployment steps
        if [ -f "resourcepack.zip" ]; then
          mv resourcepack.zip "$GITHUB_WORKSPACE/"
        elif [ -f "../resourcepack.zip" ]; then
          echo "Pack already compiled in parent workspace."
        else
          # Fallback check in case it compiled directly in the root directory
          find "$GITHUB_WORKSPACE" -name "resourcepack.zip" -print -quit || (echo "❌ Error: resourcepack.zip was not generated by combine.py!" && exit 1)
        fi

    - name: Get resourcepack sha1
      id: sha1
      run: |
        echo "sha1=$(sha1sum resourcepack.zip | awk '{print $1}')" >> $GITHUB_OUTPUT

    - name: Copy pack to web server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: ${{ secrets.SFTP_USER }}
        key: ${{ secrets.SFTP_KEY }}
        port: ${{ secrets.SFTP_PORT }}
        source: "resourcepack.zip"
        target: "/var/www/html/resourcepacks"

    - name: Generate PackPulse Manifest and Update Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: ${{ secrets.SFTP_USER }}
        key: ${{ secrets.SFTP_KEY }}
        port: ${{ secrets.SFTP_PORT }}
        script: |
          # 1. Update the local Pelican server volume just in case it's tracking anything
          PROP_FILE="/var/lib/pelican/volumes/${{ secrets.PELICAN_SERVER_ID }}/server.properties"
          if [ -f "$PROP_FILE" ]; then
            python3 -c "
            with open('$PROP_FILE', 'r') as f: lines = f.readlines()
            with open('$PROP_FILE', 'w') as f:
                for line in lines:
                    if line.startswith('resource-pack-sha1='): f.write('resource-pack-sha1=${{ steps.sha1.outputs.sha1 }}\n')
                    else: f.write(line)
            "
            echo "✅ server.properties fallback hash updated."
          fi

          # 2. Generate the dynamic PackPulse tracking manifest live on Nginx
          WEB_DIR="/var/www/html/resourcepacks"
          cat <<EOF > \$WEB_DIR/packpulse.json
          {
            "resourcepacks": [
              {
                "name": "The Boys MTR Server Assets",
                "url": "http://148.251.140.13/resourcepacks/resourcepack.zip",
                "hash": "${{ steps.sha1.outputs.sha1 }}",
                "required": true
              }
            ]
          }
          EOF
          echo "✅ packpulse.json manifest successfully generated with hash: ${{ steps.sha1.outputs.sha1 }}"

    - name: Copy pack to server volume
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: ${{ secrets.SFTP_USER }}
        key: ${{ secrets.SFTP_KEY }}
        port: ${{ secrets.SFTP_PORT }}
        source: "resourcepack.zip"
        target: "/var/lib/pelican/volumes/${{ secrets.PELICAN_SERVER_ID }}"