name: Merge Resource Packs, Hash, and Deploy

on:
  push:
    branches:
    - main
  workflow_dispatch:


jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true # Crucial for pulling down your LFS zip components

    - name: Install Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip zip coreutils

    - name: Extract and Layer Packs
      run: |
        mkdir -p extracted_workspace
        if [ ! -d "packs" ] || [ -z "$(ls -A packs/*.zip 2>/dev/null)" ]; then
          echo "❌ Error: No zip files found in the 'packs/' directory!"
          exit 1
        fi

        for pack in $(ls packs/*.zip | sort); do
          echo "Extracting and layering: $pack"
          unzip -o "$pack" -d extracted_workspace/
        done

    - name: Compile Unified Resource Pack (Fast Compression)
      run: |
        cd extracted_workspace
        zip -1 -r ../resourcepack.zip .
        cd ..

    - name: Generate SHA-1 Hash
      id: generate_hash
      run: |
        HASH=$(sha1sum resourcepack.zip | awk '{print $1}')
        echo "Generated Merged SHA-1: $HASH"
        echo "$HASH" > resourcepack.zip.sha1

    - name: Deploy directly to Dedicated Server via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "resourcepack.zip,resourcepack.zip.sha1"
        target: "/var/www/html/packs"
        strip_components: 0
