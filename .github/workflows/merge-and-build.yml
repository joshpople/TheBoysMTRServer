name: Deploy Resource Packs via Official PackPulse Script

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCEPACK_BASE_URL: http://${{ secrets.SERVER_HOST }}/resourcepacks
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true

    - name: Checkout LFS objects explicit pull
      run: git lfs pull

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Step 1: Stage the files and dynamically generate options.txt based on current directory contents
    - name: Prepare PackPulse Layout & Build options.txt
      run: |
        mkdir -p server-pack/resourcepacks
        cp packs/*.zip server-pack/resourcepacks/
        
        # Build the resource pack activation strings dynamically
        # Start with the baseline vanilla and loader profiles
        active_packs='["vanilla","fabric"'
        incompatible_packs='["jei","worldedit","xaerolib","xaerominimap","yet_another_config_lib_v3"'
        
        # Loop through every pack file and convert actual spaces into \u0020 unicode strings
        for file in packs/*.zip; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            # Replace literal spaces with the escaped \u0020 string Minecraft reads
            escaped_name=$(echo "$filename" | sed 's/ /\\u0020/g')
            
            active_packs="${active_packs},\"file/${escaped_name}\""
            incompatible_packs="${incompatible_packs},\"file/${escaped_name}\""
          fi
        done
        
        # Close out the file brackets
        active_packs="${active_packs}]"
        incompatible_packs="${incompatible_packs}]"
        
        # Save them out into a clean options.txt file inside our staging directory
        echo "resourcePacks:${active_packs}" > server-pack/options.txt
        echo "incompatibleResourcePacks:${incompatible_packs}" >> server-pack/options.txt
        
        echo "✅ Dynamically compiled options.txt file for current repository inventory!"

    # Step 2: Download and run the official manifest tool
    - name: Generate Official Manifest
      run: |
        curl -fsSL -o generate_manifest.py https://raw.githubusercontent.com/Kamilhik/PackPulseMod/main/scripts/generate_manifest.py
        
        python3 generate_manifest.py \
          --pack-root server-pack \
          --base-url "$RESOURCEPACK_BASE_URL" \
          --output server-pack/manifest.json

    # Step 3: Copy individual zips, dynamic configurations, and manifest out to Nginx
    - name: Copy packs and manifest to web server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        source: "server-pack/resourcepacks/*.zip,server-pack/options.txt,server-pack/manifest.json"
        target: "/var/www/html/resourcepacks"
        strip_components: 1