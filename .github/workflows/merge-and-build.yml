name: Merge & Build Resource Pack

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Combine packs
      run: |
        mkdir -p extracted
        mkdir -p mtr_json
        
        for file in packs/*.zip; do
          if [ -f "$file" ]; then
            pack_name=$(basename "$file" .zip)
            unzip -p "$file" "assets/mtr/mtr_custom_resources.json" > "mtr_json/${pack_name}.json" 2>/dev/null || rm -f "mtr_json/${pack_name}.json"
            7z x "$file" -y -oextracted/
          fi
        done

        if [ "$(ls -A mtr_json/*.json 2>/dev/null)" ]; then
          mkdir -p extracted/assets/mtr/
          jq -s 'reduce .[] as $item ({}; . * $item)' mtr_json/*.json > extracted/assets/mtr/mtr_custom_resources.json
        fi

        cd extracted
        7z a -tzip ../resourcepack.zip *
        cd ..
        rm -rf extracted mtr_json

    - name: Get resourcepack sha256 (Required by PackPulse)
      id: hash
      run: |
        # PackPulse uses SHA-256 instead of SHA-1 for security checking
        echo "sha256=$(sha256sum resourcepack.zip | awk '{print $1}')" >> $GITHUB_OUTPUT

    - name: Copy pack to web server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        source: "resourcepack.zip"
        target: "/var/www/html/resourcepacks"

    - name: Generate PackPulse Manifest and Update Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          WEB_DIR="/var/www/html/resourcepacks"
          
          # Generate the precise format expected by PackPulse
          cat <<EOF > \$WEB_DIR/manifest.json
          {
            "resourcepacks": [
              {
                "name": "The Boys MTR Server Assets",
                "path": "resourcepacks/resourcepack.zip",
                "url": "http://148.251.140.13/resourcepacks/resourcepack.zip",
                "hash": "${{ steps.hash.outputs.sha256 }}",
                "required": true
              }
            ]
          }
          EOF
          echo "✅ Official manifest.json successfully generated for PackPulse!"

    - name: Copy pack to server volume
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        source: "resourcepack.zip"
        target: "/var/lib/pelican/volumes/${{ secrets.PELICAN_SERVER_ID }}"